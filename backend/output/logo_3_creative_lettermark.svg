<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Embedded Google Fonts for Cross-Platform Independence -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        text-rendering: geometricPrecision;
      }
    </style>

    <!-- Dynamic Aesthetic Gradients -->
    <linearGradient id="grad-ps-300" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="grad-pa-300" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadow-subtle" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="800" height="320" rx="16" fill="#FAFAFA" />
  
    <g class="layout-horizontal">
      
    <g class="primitive-lettermark" filter="url(#shadow-subtle)">
      <!-- Outer Framed Emblem -->
      <rect x="77.2" y="77.2" width="165.6" height="165.6" 
            rx="31.464" ry="31.464" 
            fill="url(#grad-ps-300)" opacity="0.95" />
      <!-- Inner Inset Accent Frame -->
      <rect x="88.792" y="88.792" width="142.416" height="142.416" 
            rx="23.598" ry="23.598" 
            fill="none" stroke="#06B6D4" stroke-width="3.6" opacity="0.5" />
      <!-- Monogram Character -->
      <text x="160.0" y="188.152" 
            font-family="Space Grotesk, Montserrat, sans-serif" 
            font-size="97.2" 
            font-weight="800" 
            fill="#FFFFFF" 
            text-anchor="middle">K</text>
      <!-- Accent Design Element (corner dot) -->
      <circle cx="209.68" cy="110.32" r="8.1" fill="#06B6D4" />
    </g>
    
      
    <g class="typography-group">
      <!-- Brand Name -->
      <text x="300.0" y="155.0" 
            font-family="'Syne', sans-serif" 
            font-size="52.0px" 
            font-weight="800" 
            letter-spacing="0.05em" 
            fill="#171717" 
            dominant-baseline="middle">Kroma</text>
      
      <!-- Tagline / Descriptor (if present) -->
      
      <text x="302.0" y="205.0" 
            font-family="'Space Grotesk', sans-serif" 
            font-size="16px" 
            font-weight="500" 
            letter-spacing="0.22em" 
            fill="#EC4899" 
            dominant-baseline="middle">DESIGN AGENCY</text>
      
    </g>
    
    </g>
    
</svg>